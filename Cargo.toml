[workspace]
members = ["crates/busybar-anim"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Nathan <andnat@gmail.com>"]
license = "Apache-2.0 OR MIT"
edition = "2024"
repository = "https://github.com/anoldguy/busyshow"
rust-version = "1.88"

[workspace.dependencies]
# this workspace
busybar-anim = { path = "crates/busybar-anim", version = "0.1.0" }

# external
image = { version = "0.25", default-features = false, features = ["gif", "png", "webp"] }
thiserror = "2"

[package]
name = "busyshow"
description = "Convert GIF, WebP and APNG animations into the BUSY Bar .anim format and put them on the bar"
version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
readme = "README.md"

[dependencies]
busybar-anim.workspace = true
busylib = "0.0.11" # default-features = false + "reqwest" does not compile in 0.0.11
bytes = "1"
clap = { version = "4.5", features = ["derive", "env"] }
http = "1"
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "macros"] }

[dev-dependencies]
tempfile = "3"
